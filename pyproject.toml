[project]
name = "ast-sieve"
version = "0.1.0"
description = "Architecture-agnostic code quality analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0,<0.13",
    "rich>=13.7.0,<14",
    "tree-sitter>=0.22.0,<0.23",
    "tree-sitter-language-pack>=0.2.0,<0.3",
    "networkx>=3.2.0,<4",
    "pydantic>=2.7.0,<3",
    "pyyaml>=6.0.0,<7",
    "httpx>=0.27.0,<1",
    "openai>=1.30.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9",
    "ruff>=0.5.0,<1",
    "mypy>=1.10.0,<2",
    "vulture>=2.9.0,<3",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0,<9",
    "ruff>=0.5.0,<1",
    "mypy>=1.10.0,<2",
    "vulture>=2.9.0,<3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
lint.ignore = ["S101"]  # assert in tests
format.quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-x -q"

[tool.setuptools.packages.find]
where = ["."]
include = ["ast_sieve*"]