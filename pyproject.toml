[project]
name = "ast-sieve"
version = "0.1.0"
description = "Architecture-agnostic code quality analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.29,<1",
    "rich>=15,<16",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-language-pack>=1.25,<2",
    "networkx>=3.6,<4",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
llm = ["openai>=3.52,<4"]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
    "vulture>=2.16,<3",
]

[project.scripts]
ast-sieve = "ast_sieve.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ast_sieve*"]

[tool.setuptools.package-data]
ast_sieve = ["languages/**/*.scm", "languages/**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"